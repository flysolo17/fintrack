<div class="modal-header bg-danger text-white">
  <h6 class="modal-title">{{ title }}</h6>
</div>

<div class="modal-body text-center">
  {{ description }}
</div>
<div class="modal-footer">
  <button class="btn btn-outline-secondary" (click)="activeModal.close('0')">
    Cancel
  </button>
  <button class="btn btn-danger" (click)="activeModal.close('1')">
    Confirm
  </button>
</div>
