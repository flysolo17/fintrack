<div class="container py-5">
  <div class="card shadow-lg mx-auto" style="max-width: 600px">
    <div class="card-header bg-primary text-white text-center">
      <h4 class="mb-0">Edit Admin Profile</h4>
    </div>
    <div class="card-body p-4">
      <!-- Profile Picture Section -->
      <div class="text-center mb-4">
        <img
          [src]="profilePicture || defaultPicture"
          alt="Profile Picture"
          class="rounded-circle border"
          style="width: 120px; height: 120px; object-fit: cover"
        />
        <div class="mt-3">
          <label for="uploadPicture" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-upload me-2"></i>Upload Picture
          </label>
          <input
            type="file"
            id="uploadPicture"
            accept="image/*"
            (change)="onPictureSelected($event)"
            class="d-none"
          />
        </div>
      </div>

      <!-- Edit Admin Form -->
      <form (ngSubmit)="updateProfile()" #editProfileForm="ngForm">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="Enter full name"
            [(ngModel)]="admin.name"
            name="name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <input
            type="text"
            id="role"
            class="form-control"
            placeholder="Enter role"
            [(ngModel)]="admin.role"
            name="role"
            required
          />
        </div>

        <div class="mb-3">
          <label for="contact" class="form-label">Contact Number</label>
          <input
            type="text"
            id="contact"
            class="form-control"
            placeholder="Enter contact number"
            [(ngModel)]="admin.contact"
            name="contact"
            required
          />
        </div>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success w-100 me-2">
            <i class="fas fa-save me-2"></i>Save Changes
          </button>
          <button
            type="button"
            class="btn btn-secondary w-100"
            (click)="cancelEdit()"
          >
            <i class="fas fa-times-circle me-2"></i>Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
