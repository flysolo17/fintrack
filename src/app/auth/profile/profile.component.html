<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
      <div class="sidebar p-4 shadow-sm rounded">
        <h4 class="text-center mb-4">Profile Settings</h4>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="profile" routerLinkActive="active">
              <i class="fas fa-user me-2"></i> Personal Info
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="security" routerLinkActive="active">
              <i class="fas fa-lock me-2"></i> Security
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="preferences" routerLinkActive="active">
              <i class="fas fa-cogs me-2"></i> Preferences
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Profile Settings Form -->
    <div class="col-md-9">
      <div class="card p-4 shadow-sm rounded">
        <h3 class="mb-4">Update Profile</h3>
        <form>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" placeholder="Enter your username" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phone" placeholder="Enter your phone number" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="address" class="form-label">Address</label>
              <textarea class="form-control" id="address" rows="3" placeholder="Enter your address" readonly></textarea>
            </div>
          </div>

          <div class="mb-3">
            <label for="profile-picture" class="form-label">Profile Picture</label>
            <input type="file" class="form-control" id="profile-picture" />
          </div>

          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-danger" (click)="logout()">Logout</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
