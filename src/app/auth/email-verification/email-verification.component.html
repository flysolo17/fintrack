<div class="container mt-5">
  <div class="card">
    <div class="card-body text-center">
      <h3>Email Verification</h3>
      <p *ngIf="!isVerified">
        Your email <strong>{{ email }}</strong> is being verified. Please
        wait...
      </p>

      <p *ngIf="isVerified">
        Your email <strong>{{ email }}</strong> has been verified!
      </p>
    </div>
  </div>
</div>
